AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  ForgeOS AI - Full Stack
  Lambda + API Gateway + Bedrock + S3 + CloudFront + ACM + Route53
  Custom Domain: forgeos-ai.wmintelliops.com

# ============================================================
# NOTE: ACM Certificate for CloudFront MUST be in us-east-1.
# This template uses a separate nested stack (certificate.yaml)
# deployed in us-east-1 to provision the cert, then passes
# the ARN into the CloudFront distribution here.
# ============================================================

Parameters:

  DomainName:
    Type: String
    Default: forgeos-ai.wmintelliops.com
    Description: Custom domain for the ForgeOS AI frontend

  HostedZoneId:
    Type: String
    Description: >
      Route53 Hosted Zone ID for wmintelliops.com.
      Find it at: AWS Console → Route53 → Hosted Zones → wmintelliops.com
    Default: "Z042530924U7M2H4O1QVK"

  CertificateArn:
    Type: String
    Description: >
      ACM Certificate ARN - MUST be from us-east-1 region (CloudFront requirement).
      Go to: ACM Console (switch region to us-east-1) → Your certificate → Copy ARN.
      Format: arn:aws:acm:us-east-1:ACCOUNT_ID:certificate/xxxx
    Default: ""

Globals:
  Function:
    Runtime: python3.12
    MemorySize: 1024
    Timeout: 60
  Api:
    Cors:
      AllowMethods: "'POST,OPTIONS'"
      AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key'"
      AllowOrigin: "'*'"

Resources:

  # ========================================
  # Backend: Lambda + API Gateway
  # ========================================

  ForgeOSAIChat:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_function.lambda_handler
      CodeUri: ../forgeos-ai-backend/

      Environment:
        Variables:
          INFERENCE_PROFILE_ARN: arn:aws:bedrock:ap-south-1:036160411876:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0

      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
                - bedrock:InvokeModelWithResponseStream
              Resource: "*"

      Events:
        ChatAPI:
          Type: Api
          Properties:
            Path: /chat
            Method: post

  # ========================================
  # Frontend: S3 Bucket
  # ========================================

  ForgeOSAIBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # No BucketName set - CloudFormation auto-generates a unique name
      # This avoids conflicts with any pre-existing bucket
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - GET
              - HEAD
            AllowedHeaders:
              - '*'

  ForgeOSAIBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ForgeOSAIBucket
      PolicyDocument:
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: 's3:GetObject'
            Resource: !Sub '${ForgeOSAIBucket.Arn}/*'

  # ========================================
  # CloudFront Distribution
  # ========================================

  ForgeOSAICloudFront:
    Type: AWS::CloudFront::Distribution
    DependsOn: ForgeOSAIBucket
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: ForgeOS AI - forgeos-ai.wmintelliops.com
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100

        # Custom domain alias
        Aliases:
          - !Ref DomainName

        # ACM SSL Certificate (provisioned in us-east-1 via certificate.yaml)
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021

        Origins:
          - Id: S3WebsiteOrigin
            # S3 website endpoint (supports index.html routing)
            DomainName: !Sub 'forgeos-ai-bucket.s3-website.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              HTTPPort: 80
              HTTPSPort: 443
              OriginProtocolPolicy: http-only

        DefaultCacheBehavior:
          TargetOriginId: S3WebsiteOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none

        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ========================================
  # Route53: A Record → CloudFront (Alias)
  # ========================================

  ForgeOSAIDNSRecord:
    Type: AWS::Route53::RecordSet
    DeletionPolicy: Retain
    DependsOn: ForgeOSAICloudFront
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        # Z2FDTNDATAQYW2 is the fixed CloudFront hosted zone ID (AWS global constant)
        HostedZoneId: Z2FDTNDATAQYW2
        DNSName: !GetAtt ForgeOSAICloudFront.DomainName
        EvaluateTargetHealth: false

# ========================================
# Outputs
# ========================================

Outputs:

  ApiUrl:
    Description: "API Gateway endpoint URL - set as NEXT_PUBLIC_API_URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
    Export:
      Name: ForgeOSAI-ApiUrl

  BucketName:
    Description: "S3 Bucket name for frontend"
    Value: !Ref ForgeOSAIBucket
    Export:
      Name: ForgeOSAI-BucketName

  CloudFrontDomain:
    Description: "CloudFront default domain (*.cloudfront.net)"
    Value: !GetAtt ForgeOSAICloudFront.DomainName
    Export:
      Name: ForgeOSAI-CloudFrontURL

  CloudFrontDistributionId:
    Description: "CloudFront Distribution ID - used for cache invalidation in CI/CD"
    Value: !Ref ForgeOSAICloudFront
    Export:
      Name: ForgeOSAI-CloudFrontDistributionId

  CustomDomainURL:
    Description: "Your live ForgeOS AI URL"
    Value: !Sub "https://${DomainName}"
    Export:
      Name: ForgeOSAI-CustomDomainURL
