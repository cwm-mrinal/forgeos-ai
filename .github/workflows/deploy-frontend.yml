name: Deploy ForgeOS AI Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'forgeos-ai-frontend/**'
      - '.github/workflows/deploy-frontend.yml'

  workflow_dispatch:

jobs:
  deploy-frontend:
    name: Build Next.js & Deploy to S3 + CloudFront
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. Checkout Code
      # ----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Configure AWS Credentials
      # ----------------------------------------
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ----------------------------------------
      # 3. Setup Node.js
      # ----------------------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ----------------------------------------
      # 4. Fetch Stack Outputs from CloudFormation
      # ----------------------------------------
      - name: Get Stack Outputs from CloudFormation
        id: get-stack-outputs
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name forgeos-ai-stack \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          echo "API_URL=$API_URL" >> $GITHUB_OUTPUT
          echo "Fetched API URL: $API_URL"

          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name forgeos-ai-stack \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='BucketName'].OutputValue" \
            --output text)
          echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "Fetched Bucket Name: $BUCKET_NAME"

      # ----------------------------------------
      # 5. Install Dependencies
      # ----------------------------------------
      - name: Install Dependencies
        working-directory: forgeos-ai-frontend
        run: npm install

      # ----------------------------------------
      # 6. Build Next.js Static Export
      # ----------------------------------------
      - name: Build Next.js App
        working-directory: forgeos-ai-frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.get-stack-outputs.outputs.API_URL }}
        run: npm run build

      # ----------------------------------------
      # 7. Sync to S3
      #    - JS/CSS/fonts: long cache (immutable)
      #    - HTML files: no-cache (always fresh)
      # ----------------------------------------
      - name: Deploy to S3
        run: |
          BUCKET_NAME=${{ steps.get-stack-outputs.outputs.BUCKET_NAME }}

          # Upload static assets with long-term cache
          aws s3 sync forgeos-ai-frontend/out/ s3://$BUCKET_NAME \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html"

          # Upload HTML files with no-cache
          aws s3 sync forgeos-ai-frontend/out/ s3://$BUCKET_NAME \
            --cache-control "public, no-cache" \
            --include "*.html"

      # ----------------------------------------
      # 8. Invalidate CloudFront Cache
      # ----------------------------------------
      - name: Invalidate CloudFront Cache
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name forgeos-ai-stack \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDistributionId'].OutputValue" \
            --output text)

          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "No CloudFront distribution found yet - skipping invalidation"
            exit 0
          fi

          echo "Invalidating CloudFront distribution: $DISTRIBUTION_ID"
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"

      # ----------------------------------------
      # 9. Print Live URLs
      # ----------------------------------------
      - name: Print Live URLs
        run: |
          echo "========================================"
          echo "Frontend deployed successfully!"
          echo "========================================"
          echo "Custom Domain : https://forgeos-ai.wmintelliops.com"
          echo "CloudFront URL: https://$(aws cloudformation describe-stacks \
            --stack-name forgeos-ai-stack \
            --region ${{ secrets.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='CloudFrontDomain'].OutputValue" \
            --output text)"
          echo "========================================"
